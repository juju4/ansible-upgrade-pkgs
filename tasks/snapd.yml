---

- name: Set snapd refresh timer
  ansible.builtin.command:  # noqa no-changed-when
    cmd: snap set system refresh.timer={{ upgrade_pkgs_snap_refresh_timer }}
  become: true

# https://askubuntu.com/questions/920443/where-can-i-find-snapd-update-or-refresh-logs-how-does-snapd-inform-the-user-ab
# https://bugs.launchpad.net/ubuntu/+source/snapd/+bug/1695934
- name: Get snap changes
  ansible.builtin.command:
    cmd: snap changes
  changed_when: false
  register: snap_changes

- name: Check no error in snap changes
  ansible.builtin.assert:
    that:
      - "'Error' not in snap_changes.stdout"

- name: Snap refresh block
  block:
    - name: Snap refresh
      ansible.builtin.command:
        cmd: snap refresh
      register: snap_refresh
      changed_when:
        - "'All snaps up to date.' not in snap_refresh.stderr"
    - name: Debug | snap refresh out
      ansible.builtin.debug:
        var: snap_refresh
  rescue:
    - name: Include immutable
      ansible.builtin.include_tasks: immutable.yml
      vars:
        target_dir: /etc/systemd/system
        state: pre
    - name: Snap refresh (immutable)
      ansible.builtin.command:
        cmd: snap refresh
      register: snap_refresh
      changed_when:
        - "'All snaps up to date.' not in snap_refresh.stderr"
    - name: Debug | snap refresh out
      ansible.builtin.debug:
        var: snap_refresh
    - name: Include immutable
      ansible.builtin.include_tasks: immutable.yml
      vars:
        target_dir: /etc/systemd/system
        state: post
