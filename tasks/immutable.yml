---
## manage install when some directories are immutable
## requires target_dir, state=pre/post

- name: Ensure e2fsprogs is present
  ansible.builtin.package:
    name: e2fsprogs
    state: present

- name: Pre-change immutable
  when: state == 'pre'
  block:
    ## Ansible 2.3+ for get_attributes
    - name: Check target_dir attributes - {{ target_dir }}
      # ansible.builtin.stat:
      #   path: "{{ target_dir }}"
      #   get_attributes: yes
      ansible.builtin.command:  # noqa no-changed-when
        cmd: "lsattr -d '{{ target_dir }}'"
      register: dir
      changed_when: false
      failed_when: false

    - name: Remove immutable attribute
      ansible.builtin.command:  # noqa no-changed-when
        cmd: "chattr -i '{{ target_dir }}'"
      when:
        - dir.rc == 0
        - dir.stdout.find('-i-') != -1

- name: Reestablish immutable attribute
  ansible.builtin.command:  # noqa no-changed-when
    cmd: "chattr +i '{{ target_dir }}'"
  # ansible.builtin.file:
  #   dest: "{{ target_dir }}"
  #   attributes: '----i-----I--e--'
  failed_when: false
  when: state == 'post'
